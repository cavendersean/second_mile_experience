<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Second Mile Experience | Tidal Wave Auto Spa</title>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI',sans-serif;

    background:
    radial-gradient(circle at 15% 20%, rgba(255,255,255,.35) 0 50px, transparent 55px),
    radial-gradient(circle at 80% 20%, rgba(255,255,255,.25) 0 80px, transparent 85px),
    radial-gradient(circle at 10% 80%, rgba(255,255,255,.20) 0 70px, transparent 75px),
    radial-gradient(circle at 90% 85%, rgba(255,255,255,.30) 0 100px, transparent 105px),
    linear-gradient(
        180deg,
        #dff7ff 0%,
        #bceeff 40%,
        #74d8ff 100%
    );

    min-height:100vh;
    color:#002f87;
}

/* HEADER */

.header{
    background:white;
    padding:15px 30px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
}

.logo{
    height:85px;
}

.nav{
    display:flex;
    gap:25px;
    flex-wrap:wrap;
    font-weight:bold;
}

.nav span{
    cursor:pointer;
}

.portal-label{
    color:#00a6f4;
}

/* HERO */

.hero{
    background:
    linear-gradient(
    135deg,
    rgba(75,46,160,.90),
    rgba(41,86,203,.90),
    rgba(26,200,255,.85)
    ),
    url("images.jpg");

    background-size:cover;
    background-position:center;

    text-align:center;
    color:white;

    padding:100px 20px;
}

.hero h1{
    font-size:58px;
    margin-bottom:20px;
}

.hero p{
    font-size:24px;
    max-width:750px;
    margin:auto;
    line-height:1.6;
}

/* MAIN */

.container{
    max-width:1200px;
    margin:auto;
    margin-top:-60px;
    padding:20px;
}

.card{
    background:white;
    border-radius:30px;
    padding:40px;
    box-shadow:0 15px 35px rgba(0,47,135,.15);
}

/* INFO BOX */

.info-box{
    background:#eef9ff;
    border-radius:20px;
    padding:25px;
    text-align:center;
    margin-bottom:30px;
}

.info-box h3{
    margin-bottom:20px;
}

.steps{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    justify-content:center;
}

.step{
    background:white;
    border-radius:12px;
    padding:12px 16px;
    font-weight:bold;
}

/* FORM */

h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    color:#5376a8;
}

label{
    display:block;
    margin-top:20px;
    font-weight:bold;
}

input,
textarea{
    width:100%;
    margin-top:8px;
    padding:15px;
    border-radius:12px;
    border:1px solid #cfd9e7;
    font-size:16px;
}

textarea{
    resize:vertical;
}

/* TILES */

.tiles{
    margin-top:30px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
}

.tile{
    background:#f8fbff;
    border:2px solid transparent;

    border-radius:20px;
    padding:30px;

    min-height:150px;

    cursor:pointer;

    transition:.2s;
}

.tile:hover{
    border-color:#00a6f4;
    transform:translateY(-3px);
}

.tile.selected{
    background:#e5f7ff;
    border-color:#00a6f4;
}

.tile h3{
    margin-bottom:12px;
}

.tile p{
    line-height:1.4;
}
